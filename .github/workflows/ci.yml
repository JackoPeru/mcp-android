name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: node -p "'RELEASE_TAG=v' + require('./package.json').version"
      - name: Set RELEASE_TAG from package.json
        run: echo "RELEASE_TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=moderate
      - run: git diff --check

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Android tests, lint and build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  windows-check:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts
      - name: Node syntax check
        run: node --check bridge/server.js
      - name: PowerShell script WhatIf
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/build-android.ps1", [ref]$null, [ref]$null) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/publish-release.ps1", [ref]$null, [ref]$null) | Out-Null
      - run: git diff --check
