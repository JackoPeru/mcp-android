name: iOS build

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select latest Xcode with simulator runtime
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available | head -20

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Run core tests on simulator
        working-directory: ios
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['udid'] for r in d.values() for dev in r if 'iPhone' in dev['name']))")
          echo "Using simulator $UDID"
          xcodebuild test \
            -project MCPiOS.xcodeproj \
            -scheme MCPiOS \
            -destination "id=$UDID" \
            -only-testing:MCPiOSTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned app for device
        working-directory: ios
        run: |
          xcodebuild build \
            -project MCPiOS.xcodeproj \
            -scheme MCPiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          rm -rf Payload mcp-ios-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r mcp-ios-unsigned.ipa Payload

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-ios-unsigned-ipa
          path: ios/mcp-ios-unsigned.ipa
          if-no-files-found: error
